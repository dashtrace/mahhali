# Local development database. Production uses deploy/docker-compose.prod.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mahhali
      POSTGRES_PASSWORD: mahhali
      POSTGRES_DB: mahhali
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
