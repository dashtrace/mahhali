name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mahhali
          POSTGRES_PASSWORD: mahhali
          POSTGRES_DB: mahhali_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mahhali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mahhali:mahhali@localhost:5432/mahhali_test
      TEST_DATABASE_URL: postgresql://mahhali:mahhali@localhost:5432/mahhali_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: OpenAPI and ERD match the code
        run: |
          npm run openapi
          npm run erd
          git diff --exit-code docs/openapi.json docs/erd.md
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  deploy:
    # Turn on by setting the repository variable DEPLOY_ENABLED=true once the
    # Railway project exists, and add the secrets listed in deploy/README.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Railway builds the Dockerfile, runs migrations (railway.json) and swaps in the new version.
      - run: railway up --ci --service mahhali
